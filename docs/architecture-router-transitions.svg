<svg width="680" height="360" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent Router routes directly to either Research Agent or Warm-Path Agent based on the task; both can transition onward horizontally through Warm-Path to Outreach Agent for the final brief">
<rect width="680" height="360" fill="#FFFFFF"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="190" y="20" width="300" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="45" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Seller's request</text>

<line x1="340" y1="60" x2="340" y2="80" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="210" y="80" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Agent Router</text>
<text x="340" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Routes once, based on the task</text>

<line x1="340" y1="136" x2="140" y2="196" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="136" x2="340" y2="196" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="196" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="140" y="218" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#042C53">Research agent</text>
<text x="140" y="236" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#185FA5">Resolves account, gathers signals</text>

<rect x="250" y="196" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="218" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#633806">Warm-path agent</text>
<text x="340" y="236" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#854F0B">Checks relationship status</text>

<rect x="450" y="196" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="540" y="218" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C">Outreach agent</text>
<text x="540" y="236" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">Synthesizes the final brief</text>

<line x1="230" y1="224" x2="250" y2="224" stroke="#534AB7" stroke-width="2" marker-end="url(#arrow-purple)"/>
<line x1="430" y1="224" x2="450" y2="224" stroke="#534AB7" stroke-width="2" marker-end="url(#arrow-purple)"/>
<text x="240" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">transition</text>
<text x="440" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">transition</text>

<line x1="540" y1="252" x2="540" y2="280" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="252" x2="340" y2="280" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<rect x="50" y="280" width="580" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="305" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Response to the seller</text>
</svg>
